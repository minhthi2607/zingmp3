<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Zing MP3</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
</head>
<body>

<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark pt-4">
    <div class="container">
        <a class="navbar-brand fs-3" th:href="@{/}">Zing<span>MP3</span></a>
        <div class="d-flex align-items-center gap-3">
            <th:block th:if="${session.user == null or session.user.username == null}">
                <a th:href="@{/login}" class="text-decoration-none text-white-50 fw-medium small">Đăng nhập</a>
                <a th:href="@{/register}" class="text-decoration-none text-white-50 fw-medium small">Đăng ký</a>
            </th:block>
            <th:block th:if="${session.user != null and session.user.username != null}">
                <span class="text-white-50 fw-medium small" th:text="'Chào, ' + ${session.user.username}"></span>
            </th:block>
            <a th:href="@{/songs/create}" class="btn btn-zing shadow-sm">
                <i class="bi bi-plus-lg me-1"></i> Tải lên bài hát
            </a>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
