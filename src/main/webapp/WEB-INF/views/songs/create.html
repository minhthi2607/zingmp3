<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="/layout/layout :: head('Zing MP3 - Tải lên bài hát')"></head>
<body>

<nav th:replace="/layout/layout :: header"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="mb-4 d-flex align-items-center">
                <a th:href="@{/songs}" class="btn btn-link text-white p-0 me-3 text-decoration-none">
                    <i class="bi bi-arrow-left fs-4"></i>
                </a>
                <h2 class="fw-bold mb-0">Tải lên bài hát mới</h2>
            </div>

            <div class="card shadow-lg">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/songs/create}" th:object="${songForm}" method="post" enctype="multipart/form-data">
                        
                        <div class="mb-4">
                            <label for="name" class="form-label text-uppercase">Tên bài hát</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên bài hát" >
                            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="singer" class="form-label text-uppercase">Nghệ sĩ</label>
                                <input type="text" id="singer" th:field="*{singer}" class="form-control" placeholder="Tên ca sĩ, ban nhạc" >
                                <span class="text-danger" th:if="${#fields.hasErrors('singer')}" th:errors="*{singer}"></span>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="image" class="form-label text-uppercase">Ảnh bìa</label>
                                <div class="position-relative">
                                    <input type="file" id="image" th:field="*{image}" class="form-control" accept="image/*" required>
                                    <div class="form-text text-muted small mt-1">Hỗ trợ: JPG, PNG (Tỷ lệ 1:1)</div>
                                </div>
                                <span class="text-danger" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></span>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="audio" class="form-label text-uppercase">Tệp âm thanh</label>
                                <input type="file" id="audio" th:field="*{audio}" class="form-control" accept="audio/*" required>
                                <div class="form-text text-muted small mt-1">Hỗ trợ: MP3, WAV...</div>
                                <span class="text-danger" th:if="${#fields.hasErrors('audio')}" th:errors="*{audio}"></span>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="lyrics" class="form-label text-uppercase">Lời bài hát</label>
                            <textarea id="lyrics" th:field="*{lyrics}" class="form-control" rows="6" placeholder="Chia sẻ lời bài hát tại đây..."></textarea>
                            <span class="text-danger" th:if="${#fields.hasErrors('lyrics')}" th:errors="*{lyrics}"></span>
                        </div>
                        
                        <div class="pt-3">
                            <button type="submit" class="btn btn-zing w-100 fs-5 py-2">
                                <i class="bi bi-cloud-arrow-up me-2"></i> Xuất bản ngay
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="text-muted small">Bằng cách tải lên, bạn đồng ý với Điều khoản sử dụng của Zing MP3.</p>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="/layout/layout :: scripts"></th:block>
</body>
</html>
